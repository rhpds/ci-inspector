[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-inspector"
version = "0.1.0"
description = "Catalog Item infrastructure inspector for Babylon/AgnosticV"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
k8s = ["kubernetes>=29.0"]
sheets = ["gspread>=6.0", "google-auth>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
all = ["ci-inspector[k8s,sheets,dev]"]

[project.scripts]
ci-inspector = "ci_inspector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
